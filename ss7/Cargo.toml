[package]
name = "ss7"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
eframe = "0.29"
egui = "0.29"
tokio = { version = "1.49", features = ["rt-multi-thread", "time"] }
tokio-postgres = "0.7"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
